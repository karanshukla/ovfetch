name: CI

on:
  push:
    branches: [main]
  # discover.yml's bot-opened PRs run this in "awaiting approval" until a
  # maintainer approves the run, which doubles as a review gate.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The library alone, as embedders build it: offline, no network crates.
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      # The data files are compiled in, so this also proves every one parses.
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features

  # Cargo.toml declares rust-version = "1.88"; let-chains need exactly that,
  # so an API from a newer release would otherwise break 1.88 users unseen.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --no-default-features --all-targets

  # What release.yml ships is the static musl binary, so test on that target
  # and run the release build itself, not just the glibc debug one.
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked --target x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Smoke-test the release binary
        run: |
          bin=target/x86_64-unknown-linux-musl/release/ovfetch
          file "$bin" | tee /dev/stderr | grep -q 'static'
          "$bin" --version
          "$bin" detect | jq -e '.devices | type == "array"'

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The repo's action allowlist has no installer action, so fetch the
      # release binary and check it against a pinned digest instead.
      - name: Install cargo-llvm-cov
        env:
          VERSION: v0.9.1
          SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
        run: |
          curl -fsSLo llvm-cov.tar.gz "https://github.com/taiki-e/cargo-llvm-cov/releases/download/$VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          echo "$SHA256  llvm-cov.tar.gz" | sha256sum -c -
          tar -xzf llvm-cov.tar.gz -C ~/.cargo/bin
          rm llvm-cov.tar.gz
      # Measured 61.2% of lines when this was added (46.9% before its tests).
      # Network code (net, sources, ci audit/discover, resolve) has no test
      # seam yet, which keeps the total down. Raise the floor as tests land.
      - run: cargo llvm-cov --locked --lcov --output-path lcov.info --fail-under-lines 58
      - run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            cargo llvm-cov report --locked --summary-only | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error

  # actionlint also runs shellcheck over every `run:` block.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP/bin" actionlint
          rm actionlint.tar.gz
      - run: '"$RUNNER_TEMP/bin/actionlint"'

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # guard.yml runs from main under pull_request_target, so a change to it is
  # only exercised once merged. This runs the PR's copy against a stub `gh`.
  guard-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck .github/tests/guard.sh
      - run: bash .github/tests/guard.sh
