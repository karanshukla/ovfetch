name: Discover

# Records new onnxruntime-openvino/openvino releases, NPU driver releases, NPU
# platforms from the kernel's ivpu driver, and ONNX Runtime tags into data/,
# and opens a PR. Nothing reaches users until a human merges it and a release
# is cut, so a poisoned upstream release still has to get past review.

on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release
      - name: Discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: target/release/ovfetch --data-dir data ci discover > changes.md
      - name: Open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s changes.md ]; then
            echo "nothing new"
            exit 0
          fi
          branch="discover/$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data
          git commit -m "data: record upstream releases found $(date -u +%F)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push --force-with-lease origin "$branch"
          {
            echo "Found by \`ovfetch ci discover\`. Review before merging: everything here ships in the next release's compiled-in ledger."
            echo
            echo "- A new platform with an empty codename has no floor until one is filled in."
            echo "- A floor derived from driver notes is only as good as Intel's \"verified on\" table. Pin a tested one with \`pinned_note\`."
            echo
            cat changes.md
          } > body.md
          gh pr create --head "$branch" --title "data: upstream releases $(date -u +%F)" --body-file body.md
