[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0", "Zlib", "BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Only crates.io. A git dependency or a second registry is a new party to trust.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
